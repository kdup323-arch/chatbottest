<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>챗봇 체험장</title>
<meta name="description" content="우리 회사 챗봇을 여러 종류의 홈페이지에 붙여 보고 손님처럼 물어볼 수 있어요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#15202B;--sub:#5B6770;--line:#DCE1E5;--bg:#F3F5F7;--card:#fff;--act:#1F4FD8;--ok:#1B8556;--warn:#B4541A}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#E8ECEF;--sub:#9AA6AF;--line:#2C353D;--bg:#12171C;--card:#1A2128;--act:#7C9BFF;--ok:#4CC38A;--warn:#F0A060}}
  :root[data-theme="dark"]{--ink:#E8ECEF;--sub:#9AA6AF;--line:#2C353D;--bg:#12171C;--card:#1A2128;--act:#7C9BFF;--ok:#4CC38A;--warn:#F0A060}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;display:flex;flex-direction:column;word-break:keep-all;overflow-wrap:break-word}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px 0}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .top h1{font-size:18px;font-weight:800;margin:0;letter-spacing:-.01em}
  .top p{margin:0;color:var(--sub);font-size:14px}
  .attach{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
  .attach label{font-size:14px;font-weight:700;white-space:nowrap}
  .attach input{flex:1 1 260px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:14px;background:var(--bg);color:var(--ink)}
  .attach input:focus{outline:2px solid var(--act);outline-offset:1px;border-color:transparent}
  button{font:inherit;font-size:14px;cursor:pointer;border-radius:9px;padding:9px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600}
  button.go{background:var(--act);border-color:var(--act);color:#fff}
  button:focus-visible{outline:2px solid var(--act);outline-offset:2px}
  .msg{font-size:13.5px;color:var(--sub);flex-basis:100%;min-height:1.2em;margin:0}
  .msg.ok{color:var(--ok)}.msg.bad{color:var(--warn)}
  nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
  nav::-webkit-scrollbar{display:none}
  nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 12px 9px;color:var(--sub);white-space:nowrap;font-weight:600;display:flex;align-items:center;gap:6px}
  nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--act)}
  nav button i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:none}
  nav button.has i{display:inline-block}
  main{flex:1;position:relative;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  iframe[hidden]{display:none}
  .attach[hidden],.mine[hidden],nav[hidden]{display:none}
  .mine{margin:10px 0 12px;display:grid;gap:8px}
  .mine .lock{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ok)}
  .mine .lock::before{content:"";width:9px;height:7px;border:2px solid currentColor;border-radius:2px;box-shadow:0 -4px 0 -2px currentColor}
  .mine ol{margin:0;padding-left:20px;display:grid;gap:3px;font-size:14px;color:var(--sub);line-height:1.55}
  .mine ol b{color:var(--ink);font-weight:700}
  .mine .bad{color:var(--warn);font-size:14px;margin:0}
  /* 회사 전용 페이지: 채팅창 모양 맞추기 줄 */
  .fit{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 0 12px;border-top:1px solid var(--line)}
  .fit .grp{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700}
  .fit .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .fit .seg button{border:0;border-radius:0;padding:7px 12px;font-size:13.5px;background:var(--card)}
  .fit .seg button+button{border-left:1px solid var(--line)}
  .fit .seg button.on{background:var(--act);color:#fff}
  .fit .num{min-width:5.2em;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;color:var(--sub)}
  .fit button.sm{padding:6px 10px;min-width:34px}
  .fit .done{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .fit .say{font-size:13.5px;color:var(--ok);font-weight:600}
  .fit .say.bad{color:var(--warn)}
  .fit[hidden]{display:none}
  main.phone{display:grid;place-items:center;background:var(--bg);padding:20px 16px;overflow:auto}
  main.phone iframe{position:relative;inset:auto;width:390px;max-width:100%;height:min(780px,100%);border:10px solid #15202B;border-radius:34px;box-shadow:0 20px 50px -24px rgba(0,0,0,.5)}
  @media (max-width:600px){header{padding:10px 16px 0}nav{margin:0 -16px;padding:0 16px}.top p{display:none}.mine ol{font-size:13.5px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>챗봇 체험장</h1>
    <p>탭마다 다른 홈페이지예요. 탭마다 다른 챗봇을 붙여서 손님처럼 물어볼 수 있어요.</p>
  </div>
  <form class="attach" id="attach" autocomplete="off">
    <label for="tid" id="tidLabel">이 탭에 붙일 챗봇</label>
    <input id="tid" placeholder="회사 아이디나 붙이는 코드">
    <button type="submit" class="go">붙이기</button>
    <button type="button" id="demo">예시 챗봇</button>
    <button type="button" id="detach" hidden>떼기</button>
    <p class="msg" id="msg" role="status"></p>
  </form>
  <div class="mine" id="mine" hidden></div>
  <div class="fit" id="fit" hidden>
    <div class="grp">보기 <span class="seg"><button type="button" data-view="pc" class="on">PC 화면</button><button type="button" data-view="phone">휴대폰 화면</button></span></div>
    <div class="grp">채팅창 자리 <span class="seg"><button type="button" data-pos="left">왼쪽 아래</button><button type="button" data-pos="right">오른쪽 아래</button></span></div>
    <div class="grp" id="sizeGrp">가로 <button type="button" class="sm" data-d="w:-40" aria-label="가로 줄이기">←</button><span class="num" id="wNum">-</span><button type="button" class="sm" data-d="w:40" aria-label="가로 늘리기">→</button>
      세로 <button type="button" class="sm" data-d="h:-40" aria-label="세로 줄이기">↓</button><span class="num" id="hNum">-</span><button type="button" class="sm" data-d="h:40" aria-label="세로 늘리기">↑</button></div>
    <div class="grp">디자인 <span class="seg"><button type="button" data-theme="">기본</button><button type="button" data-theme="light">밝게</button><button type="button" data-theme="ink">진하게</button><button type="button" data-theme="line">단정하게</button><button type="button" data-theme="soft">부드럽게</button></span></div>
    <div class="grp">문의서 크게 보기 <span class="seg"><button type="button" data-fbig="1">켜기</button><button type="button" data-fbig="0">끄기</button></span></div>
    <div class="grp">처음부터 열어 두기 <span class="seg"><button type="button" data-auto="1">켜기</button><button type="button" data-auto="0">끄기</button></span></div>
    <div class="done"><span class="say" id="say" role="status"></span><button type="button" class="go" id="confirm">이 모양으로 확정</button></div>
  </div>
  <nav role="tablist" aria-label="예시 홈페이지" id="tabs"></nav>
</header>
<main id="stage"></main>

<script>
/* 탭 하나 = 예시 홈페이지 하나(pages/*.html)를 담은 iframe 하나. 챗봇은 그 안에만 붙어서 탭끼리 섞이지 않는다.
   탭마다 붙인 챗봇은 이 브라우저에만 기억한다(서버에는 아무것도 저장하지 않음). */
var SERVER = "https://inquiry-desk-production-aaa6e4ea.up.railway.app", LIVE_SERVER = SERVER;
var TABS = [
  { id: "maker", name: "부품 제조사" },
  { id: "shop", name: "온라인 쇼핑몰" },
  { id: "clinic", name: "동네 의원" },
  { id: "academy", name: "학원" },
  { id: "cafe", name: "카페·식당" },
  { id: "realty", name: "부동산" },
  { id: "stay", name: "펜션·숙소" },
  { id: "blank", name: "빈 페이지" }
];
/* 회사 전용 주소(?c=)로 열면 탭 없이 그 회사 이름으로 만든 홈페이지 한 장만 보여 준다 */
if (new URLSearchParams(location.search).get("c")) {
  TABS = [{ id: "company", name: "우리 회사 홈페이지" }];
  document.getElementById("tabs").hidden = true;
}
var saved = {};
try { saved = JSON.parse(localStorage.getItem("pg:tabs") || "{}") || {}; } catch (e) {}
function keep() { try { localStorage.setItem("pg:tabs", JSON.stringify(saved)); } catch (e) {} }

var tabsEl = document.getElementById("tabs"), stage = document.getElementById("stage"),
    input = document.getElementById("tid"), msg = document.getElementById("msg"), detachBtn = document.getElementById("detach"),
    frames = {}, cur = "";

TABS.forEach(function (t) {
  var b = document.createElement("button");
  b.type = "button"; b.setAttribute("role", "tab"); b.id = "tab-" + t.id; b.dataset.tab = t.id;
  b.innerHTML = "<i aria-hidden=\"true\"></i>" + t.name;
  b.onclick = function () { show(t.id); };
  tabsEl.appendChild(b);
});

/* 회사 전용 페이지: 관리 화면 7단계가 주는 주소(?c=회사아이디#k=관리열쇠). 열쇠가 맞아야만 열리고,
   열쇠는 주소에서 바로 지우고 이 브라우저에만 기억한다. 모든 탭에 그 회사 챗봇이 '써 보기' 모드로 붙는다. */
var MINE = new URLSearchParams(location.search).get("c") || "", MYKEY = "";
var LOCAL_S = new URLSearchParams(location.search).get("s") || "";   /* 내 컴퓨터 서버로 시험할 때만 */
if (MINE && /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(LOCAL_S)) SERVER = LOCAL_S;
if (MINE) {
  var hk = /(?:^|[#&])k=([^&]+)/.exec(location.hash);
  if (hk) {
    MYKEY = decodeURIComponent(hk[1]);
    try { localStorage.setItem("pg:k:" + MINE, MYKEY); } catch (e) {}
    history.replaceState(null, "", location.pathname + location.search);
  } else { try { MYKEY = localStorage.getItem("pg:k:" + MINE) || ""; } catch (e) {} }
}
function src(id) {
  if (MINE) return MYKEY && MINE_OK ? "pages/" + id + ".html?t=" + encodeURIComponent(MINE) + (SERVER !== LIVE_SERVER ? "&s=" + encodeURIComponent(SERVER) : "") + "#k=" + encodeURIComponent(MYKEY) : "pages/" + id + ".html";
  var s = saved[id], q = s ? "?t=" + encodeURIComponent(s.tid) + (s.server !== SERVER ? "&s=" + encodeURIComponent(s.server) : "") : "";
  return "pages/" + id + ".html" + q;
}
function load(id) {
  var f = frames[id];
  if (!f) { f = frames[id] = document.createElement("iframe"); f.title = TABS.filter(function (t) { return t.id === id; })[0].name + " 예시 홈페이지"; stage.appendChild(f); }
  f.src = src(id);
}
var MINE_OK = false;
function paint() {
  if (MINE) {
    TABS.forEach(function (t) { var b = document.getElementById("tab-" + t.id); b.setAttribute("aria-selected", t.id === cur); b.tabIndex = t.id === cur ? 0 : -1; b.classList.toggle("has", MINE_OK); });
    return;
  }
  TABS.forEach(function (t) {
    var b = document.getElementById("tab-" + t.id);
    b.setAttribute("aria-selected", t.id === cur); b.tabIndex = t.id === cur ? 0 : -1;
    b.classList.toggle("has", !!saved[t.id]);
    b.title = saved[t.id] ? (saved[t.id].name || saved[t.id].tid) + " 챗봇이 붙어 있어요" : "";
  });
  var s = saved[cur], name = TABS.filter(function (t) { return t.id === cur; })[0].name;
  document.getElementById("tidLabel").textContent = "'" + name + "' 탭에 붙일 챗봇";
  input.value = s ? s.tid : "";
  detachBtn.hidden = !s;
  msg.className = "msg" + (s ? " ok" : "");
  msg.textContent = s ? (s.name || s.tid) + " 챗봇이 붙어 있어요. 오른쪽 아래 버튼을 눌러 물어보세요." : "";
}
function show(id) {
  cur = id;
  if (!frames[id]) load(id);
  Object.keys(frames).forEach(function (k) { frames[k].hidden = k !== id; });
  history.replaceState(null, "", "#" + id);
  paint();
}

/* 넣은 글에서 회사 아이디와 서버 주소를 꺼낸다: 아이디만, 붙이는 코드 전체, 설정 화면 주소(?t=) 모두 받는다 */
function parse(v) {
  v = v.trim(); if (!v) return null;
  var m = /data-tenant\s*=\s*["']([^"']+)["']/.exec(v), sm = /src\s*=\s*["'](https?:\/\/[^"'\/]+)[^"']*widget\.js/.exec(v);
  if (m) return { tid: m[1], server: sm ? sm[1] : SERVER };
  try { var u = new URL(v); var t = u.searchParams.get("t"); if (t) return { tid: t, server: u.origin }; } catch (e) {}
  if (/[<>"'\s\/?#]/.test(v)) return null;
  return { tid: v, server: SERVER };
}
function attach(p) {
  msg.className = "msg"; msg.textContent = "챗봇을 찾는 중이에요…";
  fetch(p.server + "/api/t/" + encodeURIComponent(p.tid) + "/public").then(function (r) {
    if (r.status === 404) throw "none";
    if (!r.ok) throw "err";
    return r.json();
  }).then(function (c) {
    saved[cur] = { tid: p.tid, server: p.server, name: (c && c.name) || "" }; keep(); load(cur); paint();
  }).catch(function (e) {
    msg.className = "msg bad";
    msg.textContent = e === "none" ? "그런 회사 아이디가 없어요. 관리 화면 7단계의 붙이는 코드를 그대로 넣어 주세요." : "지금은 챗봇 서버에 닿지 않아요. 잠시 뒤 다시 눌러 주세요.";
  });
}
document.getElementById("attach").onsubmit = function (e) {
  e.preventDefault();
  var p = parse(input.value);
  if (!p) { msg.className = "msg bad"; msg.textContent = "회사 아이디나 붙이는 코드를 넣어 주세요."; input.focus(); return; }
  attach(p);
};
document.getElementById("demo").onclick = function () { attach({ tid: "demo", server: SERVER }); };
detachBtn.onclick = function () { delete saved[cur]; keep(); load(cur); paint(); input.focus(); };
tabsEl.addEventListener("keydown", function (e) {
  var i = TABS.map(function (t) { return t.id; }).indexOf(cur), n = TABS.length;
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    e.preventDefault(); var j = (i + (e.key === "ArrowRight" ? 1 : n - 1)) % n;
    show(TABS[j].id); document.getElementById("tab-" + TABS[j].id).focus();
  }
});
var start = location.hash.slice(1);
if (MINE) {
  document.getElementById("attach").hidden = true;
  var box = document.getElementById("mine"); box.hidden = false;
  document.querySelector(".top p").textContent = "열쇠가 담긴 이 주소를 받은 분만 볼 수 있어요.";
  box.innerHTML = '<p class="msg">확인하는 중이에요…</p>';
  var fail = function (t) { box.innerHTML = '<p class="bad">' + t + '</p>'; show(TABS[0].id); };
  if (!MYKEY) fail("이 주소로는 전용 페이지를 열 수 없어요. 관리 화면 7단계의 '테스트 해보기'를 다시 눌러 주세요.");
  else Promise.all([
    fetch(SERVER + "/api/admin/" + encodeURIComponent(MINE) + "/plan", { headers: { "x-admin-key": MYKEY } }),
    fetch(SERVER + "/api/t/" + encodeURIComponent(MINE) + "/public").then(function (r) { return r.ok ? r.json() : {}; }, function () { return {}; })
  ]).then(function (r) {
    if (!r[0].ok) { try { localStorage.removeItem("pg:k:" + MINE); } catch (e) {} fail(r[0].status === 401 || r[0].status === 404 ? "열쇠가 맞지 않거나 회사가 없어요. 관리 화면 7단계의 '테스트 해보기'를 다시 눌러 주세요." : "지금은 챗봇 서버에 닿지 않아요. 잠시 뒤 새로 고쳐 주세요."); return; }
    MINE_OK = true;
    var name = (r[1] && r[1].name) || MINE;
    document.querySelector(".top h1").textContent = name + " 전용 체험 페이지";
    frames.company && (frames.company.title = name + " 체험용 홈페이지");
    document.title = name + " 전용 체험 페이지";
    box.innerHTML = '<span class="lock">이 주소를 받은 분만 볼 수 있어요. 다른 회사와 손님에게는 안 보여요.</span>'
      + '<ol><li><b>손님처럼 물어보고, 문의서도 열어 보세요.</b> 여기서 물어본 건 손님 질문 수에 들어가지 않고 아침 메일에도 안 가요.</li>'
      + '<li><b>채팅창 자리와 크기를 맞춰 보세요.</b> 아래 줄의 화살표를 누르거나 채팅창 모서리를 끌면 돼요. 마음에 들면 \'이 모양으로 확정\'을 눌러요. \'휴대폰 화면\'에서는 휴대폰 손님에게 보이는 모습을 볼 수 있어요.</li>'
      + '<li><b>답이나 모양을 고치고 싶으면 관리 화면에서 고쳐요.</b> 고친 내용은 여기에 바로 반영돼요.</li></ol>';
    Object.keys(frames).forEach(function (k) { load(k); });
    paint();
    setupFit(r[1] && r[1].brand || {});
  }, function () { fail("지금은 챗봇 서버에 닿지 않아요. 잠시 뒤 새로 고쳐 주세요."); });
}
show(TABS.some(function (t) { return t.id === start; }) ? start : TABS[0].id);

/* 채팅창 모양 맞추기: 자리·크기를 바꿔 보고 '이 모양으로 확정'을 누르면 손님 화면에도 그대로 보인다.
   크기는 PC 화면 기준이다. 휴대폰에서는 채팅창이 늘 화면 가득 열린다. */
function setupFit(brand) {
  var fit = document.getElementById("fit"), say = document.getElementById("say"), stage = document.getElementById("stage");
  var st = { pos: brand.position === "left" ? "left" : "right", w: +brand.width || 400, h: +brand.height || 640, view: "pc", auto: !!brand.autoopen,
            theme: ["light", "ink", "line", "soft"].indexOf(brand.theme) >= 0 ? brand.theme : "", fbig: !!brand.formbig };
  fit.hidden = false;
  function widget() { var f = frames.company; try { return f && f.contentWindow && f.contentWindow.rfqWidget; } catch (e) { return null; } }
  function apply() {
    var w = widget(); if (!w) return false;
    w.place(st.pos); w.resize(st.w, st.h); if (w.theme) { w.theme(st.theme); w.formbig(st.fbig); } w.open();   /* 휴대폰 폭에서는 위젯이 알아서 화면 가득으로 바꾼다 */
    if (st.view === "pc") { var s = w.size(); if (s[0] > 0 && s[1] > 0) { st.w = s[0]; st.h = s[1]; } }   /* 화면보다 크면 줄어든 값으로(창이 닫혀 0이면 그대로) */
    return true;
  }
  function draw() {
    fit.querySelectorAll("[data-view]").forEach(function (b) { b.classList.toggle("on", b.dataset.view === st.view); });
    fit.querySelectorAll("[data-pos]").forEach(function (b) { b.classList.toggle("on", b.dataset.pos === st.pos); });
    fit.querySelectorAll("[data-theme]").forEach(function (b) { b.classList.toggle("on", b.dataset.theme === st.theme); });
    fit.querySelectorAll("[data-fbig]").forEach(function (b) { b.classList.toggle("on", (b.dataset.fbig === "1") === st.fbig); });
    fit.querySelectorAll("[data-auto]").forEach(function (b) { b.classList.toggle("on", (b.dataset.auto === "1") === st.auto); });
    document.getElementById("wNum").textContent = st.w + "px";
    document.getElementById("hNum").textContent = st.h + "px";
    document.getElementById("sizeGrp").style.opacity = st.view === "pc" ? "" : ".45";
    fit.querySelectorAll("[data-d]").forEach(function (b) { b.disabled = st.view !== "pc"; });
  }
  /* 위젯이 다 뜰 때까지 기다렸다가 맞춘다(새로 고칠 때마다) */
  function whenReady() {
    var n = 0, t = setInterval(function () {
      if (apply()) { clearInterval(t); draw(); return; }
      if (++n > 40) {   /* 10초가 지나도 위젯 손잡이가 없으면 옛 위젯이다 */
        clearInterval(t); draw();
        say.className = "say bad"; say.textContent = "채팅창이 아직 옛 버전이에요. Ctrl+Shift+R로 새로 고쳐 주세요.";
      }
    }, 250);
  }
  frames.company.addEventListener("load", whenReady);
  whenReady();
  /* 채팅창 모서리를 직접 끌어 바꾼 크기도 숫자에 반영한다 */
  setInterval(function () { var w = widget(); if (w && st.view === "pc") { var s = w.size(); if (s[0] > 0 && s[1] > 0 && (s[0] !== st.w || s[1] !== st.h)) { st.w = s[0]; st.h = s[1]; draw(); } } }, 600);
  fit.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b || b.disabled) return;
    if (b.dataset.view) { st.view = b.dataset.view; stage.classList.toggle("phone", st.view === "phone"); setTimeout(apply, 150); }
    else if (b.dataset.pos) { st.pos = b.dataset.pos; apply(); }
    else if (b.dataset.theme != null) { st.theme = b.dataset.theme; apply(); }
    else if (b.dataset.fbig) { st.fbig = b.dataset.fbig === "1"; apply(); }
    else if (b.dataset.auto) { st.auto = b.dataset.auto === "1"; }
    else if (b.dataset.d) { var p = b.dataset.d.split(":"); st[p[0]] += +p[1]; apply(); }
    else if (b.id === "confirm") { confirm(); return; }
    say.className = "say"; say.textContent = "";
    draw();
  });
  function confirm() {
    st.w = Math.max(340, st.w || 400); st.h = Math.max(420, st.h || 640); draw();   /* 위젯이 받는 가장 작은 크기 */
    var btn = document.getElementById("confirm"); btn.disabled = true;
    say.className = "say"; say.textContent = "저장하는 중이에요…";
    fetch(SERVER + "/api/t/" + encodeURIComponent(MINE) + "/public").then(function (r) { return r.ok ? r.json() : {}; }).then(function (c) {
      var b = Object.assign({}, c.brand || {}, { position: st.pos, width: st.w, height: st.h, autoopen: st.auto, theme: st.theme, formbig: st.fbig });
      return fetch(SERVER + "/api/admin/" + encodeURIComponent(MINE) + "/config", { method: "PUT", headers: { "Content-Type": "application/json", "x-admin-key": MYKEY }, body: JSON.stringify({ brand: b }) });
    }).then(function (r) {
      if (!r.ok) throw r.status;
      say.textContent = "손님 화면에도 이렇게 보이게 할게요. 채팅창은 " + (st.pos === "left" ? "왼쪽" : "오른쪽") + " 아래, 크기는 가로 " + st.w + " × 세로 " + st.h + "px이에요."
        + (st.fbig ? " 문의서는 화면 가운데 큰 창으로 열려요." : "")
        + (st.auto ? " PC에서는 홈페이지를 열면 채팅창이 바로 열려요(휴대폰은 버튼만)." : "");
    }).catch(function () {
      say.className = "say bad"; say.textContent = "저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.";
    }).then(function () { btn.disabled = false; });
  }
  draw();
}
</script>
</body>
</html>
